<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMR Settings Review</title>
  <style>
{{SETTINGS_CSS}}
  </style>
</head>
<body>
  <div id="settings-scale-frame" class="settings-scale-frame">
    <main id="settings-app" class="app-canvas" aria-label="TMR Overlay settings review"></main>
  </div>
  <script type="application/json" id="settings-app-config">{{APP_CONFIG_JSON}}</script>
  <script type="application/json" id="overlay-geometry-contract">{{GEOMETRY_JSON}}</script>
  <script>
    (() => {
      const config = JSON.parse(document.getElementById('settings-app-config').textContent);
      const geometry = JSON.parse(document.getElementById('overlay-geometry-contract').textContent);
      const metricRowsGeometry = geometry?.metricRows || {};
      const settingsGeometry = geometry?.settingsGeometry || {};
      const overlaySizes = geometry?.overlaySizes || {};
      const tableGeometry = geometry?.tableGeometry || {};
      const app = document.getElementById('settings-app');
      const scaleFrame = document.getElementById('settings-scale-frame');
      const sessionLabels = normalizedSessionLabels(config.sessionLabels);
      const designWidth = settingsGeometryNumber('designWidth', 1152);
      const designHeight = settingsGeometryNumber('designHeight', 608);
      const state = {
        selectedTab: initialTab(),
        selectedRegion: initialRegion(),
        previewMode: config.previewMode || 'off',
        unitSystem: config.unitSystem || 'Metric',
        support: {
          rawCaptureEnabled: config.support?.rawCaptureEnabled === true,
          latestBundlePath: config.support?.latestBundlePath || '',
          statusText: config.support?.statusText || '',
          statusTone: config.support?.statusTone || 'neutral',
          updateText: config.support?.updateText || 'Current v1.0.3.',
          updateTone: config.support?.updateTone || 'success',
          canCheckUpdates: config.support?.canCheckUpdates !== false,
          canInstallUpdate: config.support?.canInstallUpdate === true,
          canRestartUpdate: config.support?.canRestartUpdate === true,
          updatePendingRestart: config.support?.updatePendingRestart === true
        }
      };
      normalizeSelectedRegion();
      const latestBundleValueMaxLength = 30;
      applySessionLayoutVars();
      applyReviewScale();
      window.addEventListener('resize', applyReviewScale);

      function initialTab() {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get('tab') || config.selectedTab || 'general';
        return knownTab(requested) ? requested : 'general';
      }

      function initialRegion() {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get('region') || config.selectedRegion || 'general';
        return ['general', 'content', 'header', 'footer', 'preview', 'twitch'].includes(requested) ? requested : 'general';
      }

      function knownTab(tabId) {
        return tabId === 'general'
          || tabId === 'support'
          || config.overlays.some((overlay) => overlay.id === tabId);
      }

      function currentOverlay() {
        return config.overlays.find((overlay) => overlay.id === state.selectedTab) || null;
      }

      function normalizeSelectedRegion() {
        const overlay = currentOverlay();
        if (!overlay) {
          state.selectedRegion = 'general';
          return;
        }

        const regions = regionsFor(overlay);
        if (!regions.includes(state.selectedRegion)) {
          state.selectedRegion = regions[0] || 'general';
        }
      }

      function regionsFor(overlay) {
        if (!overlay) return [];
        if (overlay.id === 'garage-cover') return ['general', 'preview'];
        if (overlay.id === 'stream-chat') return ['general', 'content', 'twitch'];
        return [
          'general',
          ...(Array.isArray(overlay.contentRows) && overlay.contentRows.length > 0 ? ['content'] : []),
          ...(Array.isArray(overlay.headerRows) && overlay.headerRows.length > 0 ? ['header'] : []),
          ...(Array.isArray(overlay.footerRows) && overlay.footerRows.length > 0 ? ['footer'] : [])
        ];
      }

      function setTab(tabId) {
        if (!knownTab(tabId)) return;
        state.selectedTab = tabId;
        const overlay = currentOverlay();
        const regions = regionsFor(overlay);
        if (overlay && !regions.includes(state.selectedRegion)) {
          state.selectedRegion = regions[0] || 'general';
        } else if (!overlay) {
          state.selectedRegion = 'general';
        }
        syncUrl();
        render();
      }

      function setRegion(region) {
        const overlay = currentOverlay();
        if (!overlay || !regionsFor(overlay).includes(region)) return;
        state.selectedRegion = region;
        syncUrl();
        render();
      }

      function setPreview(mode) {
        state.previewMode = ['practice', 'qualifying', 'race'].includes(mode) ? mode : 'off';
        syncUrl();
        render();
      }

      function syncUrl() {
        const params = new URLSearchParams();
        if (state.selectedTab !== 'general') params.set('tab', state.selectedTab);
        if (currentOverlay() && state.selectedRegion !== 'general') params.set('region', state.selectedRegion);
        if (state.previewMode !== 'off') params.set('preview', state.previewMode);
        const next = `${window.location.pathname}${params.toString() ? `?${params}` : ''}`;
        window.history.replaceState(null, '', next);
      }

      function render() {
        app.replaceChildren(
          node('section', 'settings-window', {}, [
            renderTitleBar(),
            node('section', 'settings-body', {}, [
              renderSidebar(),
              renderContent()
            ])
          ])
        );
      }

      function renderTitleBar() {
        return node('header', 'titlebar', { 'data-evidence-key': 'chrome.titlebar' }, [
          node('div', 'brand-lockup', {}, [
            node('div', 'brand-mark', {}, ['TMR']),
            node('div', 'brand-copy', {}, [
              node('div', 'brand-title', {}, ['Tech Mates Racing Overlay'])
            ])
          ]),
          node('button', 'close-button', { type: 'button', 'aria-label': 'Close settings preview', 'data-evidence-key': 'chrome.close' }, ['X'], { click: closeSettingsReview })
        ]);
      }

      function renderSidebar() {
        const tabs = [
          { id: 'general', label: 'General' },
          ...config.overlays.map((overlay) => ({ id: overlay.id, label: overlay.title })),
          { id: 'support', label: 'Diagnostics' }
        ];
        return node('aside', 'sidebar', { 'aria-label': 'Settings sections' }, [
          node('nav', 'sidebar-list', {}, tabs.map((tab) => {
            const active = tab.id === state.selectedTab;
            return node('a', `sidebar-tab${active ? ' active' : ''}`, { href: appHref(tab.id) }, [tab.label], {
              click: (event) => {
                event.preventDefault();
                setTab(tab.id);
              }
            });
          }))
        ]);
      }

      function appHref(tabId, region = 'general') {
        const params = new URLSearchParams();
        if (tabId !== 'general') params.set('tab', tabId);
        if (tabId !== 'general' && tabId !== 'support' && region !== 'general') params.set('region', region);
        if (state.previewMode !== 'off') params.set('preview', state.previewMode);
        return `/review/app${params.toString() ? `?${params}` : ''}`;
      }

      function renderContent() {
        if (state.selectedTab === 'general') {
          return renderContentShell('General', 'Shared units.', null, renderGeneralPage());
        }
        if (state.selectedTab === 'support') {
          return renderContentShell('Diagnostics', 'Advanced capture and support bundle tools.', null, renderSupportPage());
        }
        const overlay = currentOverlay();
        if (!overlay) {
          return renderContentShell('Settings', 'Overlay settings and browser-source controls.', null, []);
        }
        const regions = regionsFor(overlay);
        if (!regions.includes(state.selectedRegion)) {
          state.selectedRegion = regions[0] || 'general';
          syncUrl();
        }
        return renderContentShell(
          overlay.title,
          overlay.subtitle,
          null,
          [
            renderSegments(regions),
            renderOverlayRegion(overlay)
          ],
          { hasRegions: true });
      }

      function renderContentShell(title, subtitle, status, children, options = {}) {
        return node('section', 'content-card', { 'aria-labelledby': 'page-title' }, [
          node('header', 'content-header', {}, [
            node('div', 'content-heading-copy', {}, [
              node('h1', '', { id: 'page-title' }, [title]),
              node('p', '', {}, [subtitle])
            ]),
            status ? node('span', 'header-pill', {}, [status]) : null
          ]),
          node('div', `content-body${options.hasRegions ? ' with-regions' : ' without-regions'}`, {}, children)
        ].filter(Boolean));
      }

      function renderSegments(regions) {
        return node('div', 'region-segments', { role: 'tablist', 'aria-label': 'Settings page sections' },
          regions.map((region) => node(
            'button',
            `region-segment region-${region}${region === state.selectedRegion ? ' active' : ''}`,
            { type: 'button', role: 'tab', 'aria-selected': region === state.selectedRegion ? 'true' : 'false' },
            [regionTitle(region)],
            { click: () => setRegion(region) })));
      }

      function renderGeneralPage() {
        const support = state.support;
        return [
          node('div', 'general-top-grid', {}, [
            panel('Units', 'units-panel', [
              row('Measurement system', choice(['Metric', 'Imperial'], state.unitSystem, (value) => {
                state.unitSystem = value;
                persistSettings({ kind: 'unitSystem', value });
                render();
              }), 'general.units.measurement-system')
            ]),
            panel('Updates', 'updates-panel', [
              row('Status', node('strong', `field-value ${updateToneClass(support.updateTone)}`, {}, [support.updateText]), 'general.updates.status'),
              node('div', 'button-row small', {}, [
                button('Check', () => checkReviewUpdates(), { disabled: support.canCheckUpdates === false, 'data-evidence-key': 'general.updates.check' }),
                button(support.updatePendingRestart ? 'Restart' : 'Install', () => runSupportAction(support.updatePendingRestart ? 'restartUpdate' : 'installUpdate', support.updatePendingRestart ? 'Restart requested.' : 'No installable update in review run.'), { disabled: support.updatePendingRestart ? support.canRestartUpdate === false : support.canInstallUpdate !== true, 'data-evidence-key': 'general.updates.primary' })
              ])
            ])
          ]),
          panel('Show Preview', 'preview-panel', [
            node('div', 'preview-summary', { 'data-evidence-key': 'general.preview.session-data' }, [
              node('div', 'preview-copy', {}, [
                node('span', 'field-label', { 'data-evidence-key': 'general.preview.session-data.label', 'data-evidence-role': 'label' }, ['Session data']),
                node('strong', `field-value ${state.previewMode === 'off' ? 'muted' : 'success'}`, { 'data-evidence-key': 'general.preview.session-data.value', 'data-evidence-role': 'value' }, [previewLabel(state.previewMode)])
              ])
            ]),
            node('div', 'preview-control-row', { 'data-evidence-key': 'general.preview.mode' }, [
              choice(['Off', 'Practice', 'Quali', 'Race'], previewChoice(state.previewMode), (value) => setPreview(previewModeFromChoice(value)), 'wide')
            ]),
            node('div', 'body-lines', {}, [
              node('p', '', {}, ['Uses deterministic mock telemetry for the selected session.']),
              node('p', '', {}, ['Overlay visibility, session filters, positions, scale, and opacity stay normal.']),
              node('p', '', {}, ['Hidden overlays stay hidden; Stream Chat is not forced open.'])
            ])
          ])
        ];
      }

      function renderSupportPage() {
        const support = state.support;
        const trackMapBuildEnabled = trackMapBuildFromTelemetryEnabled();
        const analysisRows = [
          ['Local map building', 'Track geometry', trackMapBuildEnabled, (isOn) => setTrackMapBuildFromTelemetry(isOn), 'Local map building', 'support.analysis.local-map-building'],
          ['Car / track history', 'Session history', true, null, 'Car / track history', 'support.analysis.car-track-history'],
          ['Fuel history', 'Fuel model', true, null, 'Fuel history', 'support.analysis.fuel-history'],
          ['Radar calibration', 'Car radar', true, null, 'Radar calibration', 'support.analysis.radar-calibration'],
          ['Post-race analysis', 'Summary analysis', true, null, 'Post-race analysis', 'support.analysis.post-race-analysis']
        ];
        return [
          node('div', 'support-stack', {}, [
            node('div', 'support-grid', {}, [
              panel('Enhanced iRacing Telemetry Capture', 'support-capture-panel', [
                row('Capture future live telemetry', toggle(support.rawCaptureEnabled, (isOn) => setRawCaptureEnabled(isOn), 'Enhanced iRacing Telemetry Capture'), 'support.capture.raw.enabled'),
                row('Latest bundle', node('code', 'value-code', {}, [latestBundleDisplayText(support.latestBundlePath)]), 'support.bundle.latest'),
                node('div', 'button-row', {}, [
                  button('Create Bundle', () => createReviewDiagnosticsBundle(), { 'data-evidence-key': 'support.bundle.create' }),
                  button('Open Bundle Folder', () => runSupportAction('openDiagnostics', 'Opened diagnostics folder.'), { 'data-evidence-key': 'support.bundle.open-folder' })
                ]),
                node('div', 'body-lines compact', {}, [
                  node('p', '', { 'data-evidence-key': 'support.capture.raw.description' }, ['Raw iRacing capture runs only when requested.']),
                  node('p', '', { 'data-evidence-key': 'support.bundle.create.description' }, ['Forensics save when capture finishes.'])
                ]),
                support.statusText ? node('p', `support-status ${support.statusTone}`, {}, [support.statusText]) : null
              ]),
              panel('Data Analysis Opt-out', 'support-analysis-panel', [
                node('div', 'analysis-control-list', {}, analysisRows.map(([label, detail, isOn, onChange, ariaLabel, key]) => (
                  node('div', `analysis-control-row${onChange ? '' : ' locked'}`, { 'data-evidence-key': key }, [
                    node('span', 'analysis-copy', {}, [
                      node('strong', '', { 'data-evidence-key': `${key}.label`, 'data-evidence-role': 'label' }, [label]),
                      node('span', '', { 'data-evidence-key': `${key}.detail`, 'data-evidence-role': 'value' }, [detail])
                    ]),
                    node('span', 'analysis-state', { 'data-evidence-key': `${key}.value`, 'data-evidence-role': 'value' }, [isOn ? 'On' : 'Off']),
                    toggle(isOn, onChange, ariaLabel, { disabled: !onChange, evidenceKey: `${key}.value` })
                  ])
                )))
              ])
            ])
          ])
        ];
      }

      function renderOverlayRegion(overlay) {
        switch (state.selectedRegion) {
          case 'content':
            return renderOverlayContent(overlay);
          case 'header':
            return renderChrome(overlay, 'Header', overlay.headerRows || []);
          case 'footer':
            return renderChrome(overlay, 'Footer', overlay.footerRows || []);
          case 'preview':
            return renderGarageCoverPreview(overlay);
          case 'twitch':
            return renderStreamChatTwitch(overlay);
          case 'streamlabs':
            return renderStreamChatStreamlabs();
          default:
            return renderOverlayGeneral(overlay);
        }
      }

      function renderOverlayGeneral(overlay) {
        const controls = [];
        if (overlay.id !== 'garage-cover') {
          controls.push(row('Visible', toggle(overlay.enabled, (isOn) => {
            overlay.enabled = isOn;
            persistSettings({ kind: 'overlayEnabled', overlayId: overlay.id, enabled: isOn });
            render();
          }), `${overlay.id}.general.visible`));
        }
        if (overlay.showScale) controls.push(row('Scale', percentSlider('Scale', overlay.scalePercent, 60, 200, 'cyan', (percent) => {
          overlay.scalePercent = percent;
          persistSettings({ kind: 'number', overlayId: overlay.id, key: 'scalePercent', value: percent });
          render();
        }), `${overlay.id}.general.scale`));
        if (overlay.showOpacity) {
          const opacityLabel = overlay.id === 'track-map' ? 'Map fill' : 'Opacity';
          const minimumOpacity = overlay.id === 'track-map' ? 0 : 20;
          controls.push(row(opacityLabel, percentSlider(opacityLabel, overlay.opacityPercent, minimumOpacity, 100, 'magenta', (percent) => {
            overlay.opacityPercent = percent;
            persistSettings({ kind: 'number', overlayId: overlay.id, key: 'opacityPercent', value: percent });
            render();
          }), `${overlay.id}.general.${slugEvidenceKey(opacityLabel)}`));
        }
        controls.push(...overlaySpecificControlRows(overlay));
        if (overlay.id === 'garage-cover') {
          controls.push(row('Cover image', node('div', 'button-row inline', {}, [
            button('Import', () => importGarageCoverPreviewImage(overlay), { 'data-evidence-key': `${overlay.id}.general.cover-image.import` }),
            button('Clear', () => {
              clearGarageCoverPreviewImage(overlay);
              overlay.garageHasImage = false;
              overlay.garagePreviewVisible = false;
              persistSettings({ kind: 'garageCover', overlayId: overlay.id, action: 'clear' });
              render();
            }, { 'data-evidence-key': `${overlay.id}.general.cover-image.clear` })
          ]), `${overlay.id}.general.cover-image`));
        }

        const panels = [panel('Overlay Controls', 'overlay-controls', controls)];
        if (overlay.route) {
          panels.push(browserSourcePanel(overlay));
        }
        return node('div', overlay.id === 'garage-cover' ? 'overlay-general-grid garage' : 'overlay-general-grid', {}, panels);
      }

      function renderGarageCoverPreview(overlay) {
        return node('div', 'content-stack garage-preview-content', {}, [
          node('div', 'garage-preview-stage', { 'data-evidence-key': 'garage-cover.preview.stage' }, [
            node('div', 'cover-preview standalone', { 'data-evidence-key': 'garage-cover.preview.shell' }, [
              node('img', 'cover-image', {
                alt: '',
                src: garageCoverPreviewImageSrc(overlay),
                'data-evidence-key': 'garage-cover.preview.image'
              }, [], {
                error: (event) => handleGarageCoverPreviewImageError(event.currentTarget)
              })
            ])
          ])
        ]);
      }

      function garageCoverPreviewImageSrc(overlay) {
        if (overlay.garagePreviewImageObjectUrl) return overlay.garagePreviewImageObjectUrl;
        return overlay.garageHasImage
          ? '/api/garage-cover/image?v=review'
          : '/api/garage-cover/default-image?v=stock';
      }

      function importGarageCoverPreviewImage(overlay) {
        const input = node('input', '', {
          type: 'file',
          accept: 'image/png,image/jpeg,image/bmp,image/gif,image/*'
        }, [], {
          change: () => {
            const file = input.files?.[0];
            if (!file) return;
            clearGarageCoverPreviewImage(overlay);
            overlay.garagePreviewImageObjectUrl = URL.createObjectURL(file);
            overlay.garageHasImage = true;
            persistSettings({
              kind: 'garageCover',
              overlayId: overlay.id,
              action: 'import',
              fileName: file.name
            });
            render();
          }
        });
        input.style.position = 'fixed';
        input.style.left = '-9999px';
        document.body.append(input);
        input.click();
        setTimeout(() => input.remove(), 1000);
      }

      function clearGarageCoverPreviewImage(overlay) {
        if (overlay?.garagePreviewImageObjectUrl) {
          URL.revokeObjectURL(overlay.garagePreviewImageObjectUrl);
          delete overlay.garagePreviewImageObjectUrl;
        }
      }

      function handleGarageCoverPreviewImageError(image) {
        if (!image) return;
        if (image.dataset.fallback !== 'default') {
          image.dataset.fallback = 'default';
          image.src = '/api/garage-cover/default-image?v=stock';
          return;
        }

        const fallback = node('div', 'cover-mark', {}, ['TMR']);
        image.replaceWith(fallback);
      }

      function renderOverlayContent(overlay) {
        if (overlay.id === 'stream-chat') return renderStreamChatContent(overlay);
        if (overlay.id === 'track-map') {
          return node('div', 'content-stack', {}, [
            contentMatrix('Content Display', overlay.contentRows || [])
          ]);
        }
        if (overlay.id === 'standings') {
          return node('div', 'content-stack standings-content', {}, [
            contentMatrix('Content Display', overlay.contentRows || [])
          ]);
        }
        if (overlay.id === 'gap-to-leader') {
          return node('div', 'content-stack', {}, [
            contentMatrix('Content Display', overlay.contentRows || [])
          ]);
        }
        if (overlay.id === 'relative') {
          return node('div', 'content-stack', {}, [
            contentMatrix('Content Display', overlay.contentRows || [])
          ]);
        }
        return contentMatrix(overlay.contentTitle || 'Content Display', overlay.contentRows || [], overlay.gridColumns || 1);
      }

      function renderStreamChatContent(overlay) {
        return node('div', 'content-stack stream-chat-content', {}, [
          panel('Chat Source', '', [
            row('Mode', choice(['Not configured', 'Streamlabs', 'Twitch'], overlay.providerLabel || 'Twitch', (value) => {
              overlay.providerLabel = value;
              persistSettings({ kind: 'streamChatProvider', overlayId: overlay.id, providerLabel: value });
              render();
            }, 'provider-choice'), 'stream-chat.content.provider'),
            row('Streamlabs URL', inputBox(overlay.streamlabsWidgetUrl || '', overlay.providerLabel === 'Streamlabs', (value) => {
              overlay.streamlabsWidgetUrl = value;
            }, 'streamlabs-url-input', { 'aria-label': 'Streamlabs URL', 'data-evidence-key': 'stream-chat.content.streamlabs-url.value' }), 'stream-chat.content.streamlabs-url'),
            row('Twitch channel', inputBox(overlay.twitchChannel || 'techmatesracing', overlay.providerLabel === 'Twitch', (value) => {
              overlay.twitchChannel = value;
            }, 'twitch-channel-input', { 'aria-label': 'Twitch channel', 'data-evidence-key': 'stream-chat.content.twitch-channel.value' }), 'stream-chat.content.twitch-channel'),
            node('div', 'button-row small stream-chat-actions', {}, [
              button('Save', () => {
                persistSettings({
                  kind: 'streamChatText',
                  overlayId: overlay.id,
                  streamlabsWidgetUrl: overlay.streamlabsWidgetUrl || '',
                  twitchChannel: overlay.twitchChannel || ''
                });
              }, { 'data-evidence-key': 'stream-chat.content.save' })
            ])
          ])
        ]);
      }

      function renderStreamChatTwitch(overlay) {
        return node('div', 'content-stack stream-chat-twitch', {}, [
          contentMatrix('Twitch Metadata', overlay.contentRows || [], 2)
        ]);
      }

      function renderStreamChatStreamlabs() {
        return node('div', 'content-stack stream-chat-streamlabs', {}, [
          panel('Streamlabs', '', [
            node('p', 'panel-note', {}, ['No Streamlabs-specific message controls yet.']),
            node('p', 'panel-note', {}, ['This page is reserved for provider-specific controls after Streamlabs payloads are verified.'])
          ])
        ]);
      }

      function renderChrome(overlay, title, rows) {
        if (!overlay.supportsChrome) {
          return panel(title, 'chrome-panel', [
            node('p', 'panel-note', {}, [`No ${title.toLowerCase()} controls yet.`]),
            node('p', 'panel-note', {}, ['This matches the current production settings surface for this overlay.'])
          ]);
        }
        if (rows.length === 0) {
          return panel(title, 'chrome-panel', [
            node('p', 'panel-note', {}, [`No ${title.toLowerCase()} controls for this overlay.`])
          ]);
        }
        const chromeSessions = chromeSessionLabels(overlay);
        const matrixKind = settingsMatrixKind(overlay, title.toLowerCase());
        return panel(title, 'chrome-panel', [
          node('div', 'chrome-table', { style: sessionColumnStyle(chromeSessions), ...matrixAttrs(matrixKind) }, [
            node('div', 'chrome-head item', matrixAttrs(matrixKind, -1, 0, '__header__', 'item'), ['Item']),
            ...chromeSessions.map((label, columnIndex) => node('div', 'chrome-head', matrixAttrs(matrixKind, -1, columnIndex + 1, '__header__', sessionKey(label)), [label])),
            ...rows.flatMap((rowItem, rowIndex) => [
              node('div', 'chrome-row-label', matrixAttrs(matrixKind, rowIndex, 0, slugEvidenceKey(rowItem), 'item'), [rowItem]),
              ...chromeSessions.map((session, columnIndex) => {
                const current = chromeEnabled(overlay, title, rowItem, session);
                return node('div', 'chrome-check', matrixAttrs(matrixKind, rowIndex, columnIndex + 1, slugEvidenceKey(rowItem), sessionKey(session)), [checkbox(current, (isOn) => {
                  setChromeEnabled(overlay, title, rowItem, session, isOn);
                  persistSettings({ kind: 'chrome', overlayId: overlay.id, area: title.toLowerCase(), label: rowItem, session, enabled: isOn });
                  render();
                }, matrixAttrs(matrixKind, rowIndex, columnIndex + 1, slugEvidenceKey(rowItem), sessionKey(session)))]);
              })
            ])
          ])
        ]);
      }

      function contentMatrix(title, rows, columns = 1, extraRows = []) {
        const overlay = currentOverlay();
        const useSessionColumns = overlay?.showSessionFilters === true;
        const matrixKind = settingsMatrixKind(overlay, state.selectedRegion);
        if (columns > 1) {
          const rowsPerColumn = Math.ceil(rows.length / Math.max(1, columns));
          return panel(title, 'content-matrix grid', [
            node('div', `toggle-grid columned ${useSessionColumns ? 'with-sessions' : 'with-visible'}`, matrixAttrs(matrixKind), Array.from({ length: columns }).map((_, column) => {
              const columnRows = rows.slice(column * rowsPerColumn, (column + 1) * rowsPerColumn);
              return node('div', 'toggle-grid-column', {}, [
                columnRows.length ? compactMatrixLegend(useSessionColumns) : null,
                ...columnRows.map((item, rowOffset) => contentGridRow(item, overlay, useSessionColumns, matrixKind, column * rowsPerColumn + rowOffset, column))
              ].filter(Boolean));
            })),
            ...extraRows
          ].filter(Boolean));
        }
        return panel(title, 'content-matrix', [
          rows.length ? node('div', `matrix-table ${useSessionColumns ? 'with-sessions' : 'with-visible'}`, matrixAttrs(matrixKind), [
            node('div', 'matrix-head item', matrixAttrs(matrixKind, -1, 0, '__header__', 'item'), ['Item']),
            ...(useSessionColumns
              ? sessionLabels.map((label, columnIndex) => node('div', 'matrix-head', matrixAttrs(matrixKind, -1, columnIndex + 1, '__header__', sessionKey(label)), [label]))
              : [node('div', 'matrix-head visible', matrixAttrs(matrixKind, -1, 1, '__header__', 'visible'), ['Visible'])]),
            ...rows.flatMap((item, rowIndex) => [
              node('div', `matrix-item${item.locked ? ' fixed' : ''}`, matrixAttrs(matrixKind, rowIndex, 0, contentKey(item), 'item'), [

                  }, matrixAttrs(matrixKind, rowIndex, columnIndex + 1, contentKey(item), sessionKey(session)))]))
                : [node('div', 'matrix-visible', matrixAttrs(matrixKind, rowIndex, 1, contentKey(item), 'visible'), [checkbox(contentEnabled(overlay, item), (isOn) => {
                    setContentEnabled(overlay, item, isOn);
                    persistSettings({ kind: 'content', overlayId: overlay?.id, key: item.key, label: item.label, enabled: isOn });
                    render();
                  }, matrixAttrs(matrixKind, rowIndex, 1, contentKey(item), 'visible'))])])
            ])
          ]) : null,

        ].filter(Boolean));

      function compactMatrixLegend(useSessionColumns) {
        return node('div', `compact-matrix-legend ${useSessionColumns ? 'with-sessions' : 'with-visible'}`, {}, [
          node('span', '', {}, ['Item']),

      function overlaySpecificControlRows(overlay) {
        if (overlay.id === 'standings') {
          return [
            row('Cars in class', stepper(formatCarCount(overlay.carsInClass), 1, 24, overlay.carsInClass, (value) => {
              overlay.carsInClass = value;

            }), 'standings.general.cars-in-class'),
            row('Multiclass sections', toggle(overlay.classSeparatorsEnabled, (isOn) => {
              overlay.classSeparatorsEnabled = isOn;

                kind: 'content',

                enabled: isOn
              });

            }), 'standings.general.multiclass-sections'),
            row('Other-class cars', stepper(`${overlay.otherClassRows} rows`, 0, 6, overlay.otherClassRows, (value) => {

              persistSettings({ kind: 'number', overlayId: overlay.id, key: 'otherClassRows', value });
              render();
            }), 'standings.general.other-class-cars')
          ];
        }

        if (overlay.id === 'relative') {
          return [
            row('Rows around focus', node('div', 'inline-setting-control', {}, [
              stepper(`${overlay.carsEachSide} each side`, 0, 8, overlay.carsEachSide, (value) => {
                overlay.carsEachSide = value;
                persistSettings({ kind: 'number', overlayId: overlay.id, key: 'carsEachSide', value });
                render();
              }),
              node('span', 'field-value muted', {}, [`${overlay.carsEachSide * 2 + 1} rows`])
            ]), 'relative.general.rows-around-focus')
          ];
        }

        if (overlay.id === 'gap-to-leader') {
          const carsEachSide = Math.max(Number(overlay.carsAhead ?? 5), Number(overlay.carsBehind ?? 5));
          return [
            row('Class gap window', stepper(`${carsEachSide} each side`, 0, 12, carsEachSide, (value) => {
              overlay.carsAhead = value;
              overlay.carsBehind = value;
              persistSettings({ kind: 'number', overlayId: overlay.id, key: 'carsAhead', value });
              persistSettings({ kind: 'number', overlayId: overlay.id, key: 'carsBehind', value });
              render();
            }), 'gap-to-leader.general.class-gap-window')
          ];
        }

        if (overlay.id === 'car-radar') {
          const warningSeconds = clampInteger(overlay.multiclassWarningSeconds, 5, 3, 10);
          const visibilitySeconds = clampInteger(overlay.radarVisibilitySeconds, 2, 2, 5);
          const showMulticlassWarning = overlay.showMulticlassWarning !== false;
          const controls = [
            row('Faster-class warning', toggle(overlay.showMulticlassWarning !== false, (isOn) => {
              overlay.showMulticlassWarning = isOn;
              overlay.content ||= {};
              overlay.content['radar.multiclass-warning'] = isOn;
              overlay.content['Faster-class warning'] = isOn;
              persistSettings({
                kind: 'content',
                overlayId: overlay.id,
                key: 'radar.multiclass-warning',
                label: 'Faster-class warning',
                enabled: isOn
              });
              render();
            }), 'car-radar.general.faster-class-warning')
          ];
          if (showMulticlassWarning) {
            controls.push(row('Multiclass window', stepper(`${warningSeconds}s back`, 3, 10, warningSeconds, (value) => {
              overlay.multiclassWarningSeconds = value;
              persistSettings({ kind: 'number', overlayId: overlay.id, key: 'multiclassWarningSeconds', value });
              render();
            }), 'car-radar.general.multiclass-window'));
          }
          controls.push(row('Radar range', stepper(`${visibilitySeconds}s away`, 2, 5, visibilitySeconds, (value) => {
            overlay.radarVisibilitySeconds = value;
            persistSettings({ kind: 'number', overlayId: overlay.id, key: 'radarVisibilitySeconds', value });
            render();
          }), 'car-radar.general.radar-range'));
          return controls;

        return [];

      function settingsMatrixKind(overlay, region) {
        if (!overlay?.id) return null;
        if (overlay.id === 'stream-chat' && region === 'twitch') return 'stream-chat.twitch';
        if (region === 'header') return `${overlay.id}.header`;
        if (region === 'content') return `${overlay.id}.content`;
        return null;
      }

      function matrixAttrs(matrixKind, rowIndex = null, columnIndex = null, rowKey = null, columnKey = null) {
        if (!matrixKind) return {};
        return {
          'data-matrix-kind': matrixKind,
          'data-row-index': rowIndex === null ? null : String(rowIndex),
          'data-column-index': columnIndex === null ? null : String(columnIndex),
          'data-row-key': rowKey === null ? null : String(rowKey),
          'data-column-key': columnKey === null ? null : String(columnKey)
        };
      }

      function contentGridRow(item, overlay, useSessionColumns, matrixKind = null, rowIndex = null, columnIndex = null) {
        const enabled = useSessionColumns
          ? sessionLabels.some((session) => contentEnabledForSession(overlay, item, session))
          : contentEnabled(overlay, item);
        return node('div', `grid-toggle-row${enabled ? '' : ' disabled'}${useSessionColumns ? ' sessions' : ' visible'}`, matrixAttrs(matrixKind, rowIndex, columnIndex, contentKey(item), `column-${columnIndex ?? 0}`), [
          node('span', '', {}, [item.label]),
          ...(useSessionColumns
            ? sessionLabels.map((session, sessionIndex) => checkbox(contentEnabledForSession(overlay, item, session), (isOn) => {
                setContentEnabledForSession(overlay, item, session, isOn);
                persistSettings({ kind: 'content', overlayId: overlay?.id, key: item.key, label: item.label, session, enabled: isOn });
                render();
              }, matrixAttrs(matrixKind, rowIndex, sessionIndex + 1, contentKey(item), sessionKey(session))))
            : [checkbox(contentEnabled(overlay, item), (isOn) => {
                setContentEnabled(overlay, item, isOn);
                persistSettings({ kind: 'content', overlayId: overlay?.id, key: item.key, label: item.label, enabled: isOn });
                render();
              }, matrixAttrs(matrixKind, rowIndex, 1, contentKey(item), 'visible'))])
        ]);
      }

      function browserSourcePanel(overlay) {
        const url = overlay.route ? `${window.location.origin}${overlay.route}` : 'No localhost route';
        return panel('Browser Source', 'browser-source-panel', [
          node('code', 'browser-url', { 'data-evidence-key': `${overlay.id}.browser-source.url` }, [url]),
          node('div', 'browser-details', { 'data-evidence-key': `${overlay.id}.browser-source.size` }, [
            node('span', '', { 'data-evidence-key': `${overlay.id}.browser-source.size.value` }, [`OBS size ${browserSize(overlay)}`])
          ]),
          node('div', 'button-row small', {}, [button('Copy', (event) => copyBrowserSourceUrl(url, event.currentTarget), { 'data-evidence-key': `${overlay.id}.browser-source.copy` })])
        ]);
      }

      function panel(title, className, children) {
        return node('section', `panel ${className || ''}`, {}, [
          node('h2', '', {}, [title]),
          ...children
        ]);
      }

      function row(label, control, evidenceKey = null) {
        const key = evidenceKey || `row.${slugEvidenceKey(label)}`;
        const rowClasses = ['field-row'];
        if (control instanceof Element) {
          const hasControlClass = (className) => control.classList.contains(className) || control.querySelector(`.${className}`);
          control.setAttribute('data-evidence-key', `${key}.value`);
          control.setAttribute('data-evidence-role', 'value');
          if (hasControlClass('slider-control-group')) rowClasses.push('slider-row');
          if (hasControlClass('stepper')) rowClasses.push('stepper-row');
          if (hasControlClass('toggle')) rowClasses.push('toggle-row');
          if (hasControlClass('segmented')) rowClasses.push('segmented-row');
          if (hasControlClass('provider-choice')) rowClasses.push('provider-choice-row');
          if (hasControlClass('text-input')) rowClasses.push('text-input-row');
          if (hasControlClass('streamlabs-url-input')) rowClasses.push('streamlabs-url-row');
          if (hasControlClass('twitch-channel-input')) rowClasses.push('twitch-channel-row');
          if (key.endsWith('.general.cover-image')) rowClasses.push('stepper-row');
        }

        return node('div', rowClasses.join(' '), { 'data-evidence-key': key }, [
          node('span', 'field-label', { 'data-evidence-key': `${key}.label`, 'data-evidence-role': 'label' }, [label]),
          control
        ]);
      }

      function statusRow(label, value, tone) {
        return node('div', 'status-row', {}, [
          node('span', 'field-label', {}, [label]),
          node('span', `status-dot ${tone}`, {}, []),
          node('strong', 'field-value', {}, [value])
        ]);
      }

      function contentKey(item) {
        return item?.key || item?.label || '';
      }

      function contentEnabled(overlay, item) {
        const content = overlay?.content || {};
        const key = contentKey(item);
        if (Object.hasOwn(content, key)) return content[key] !== false;
        if (Object.hasOwn(content, item.label)) return content[item.label] !== false;
        if (typeof item?.enabled === 'boolean') return item.enabled;
        return item?.defaultEnabled !== false;
      }

      function setContentEnabled(overlay, item, enabled) {
        overlay.content ||= {};
        overlay.content[contentKey(item)] = enabled;
        item.enabled = enabled;
      }

      function contentEnabledForSession(overlay, item, session) {
        const content = overlay?.content || {};
        const key = contentKey(item);
        const suffix = sessionKey(session);
        for (const candidate of [`${key}.${suffix}`, `${item.label}.${suffix}`]) {
          if (Object.hasOwn(content, candidate)) return content[candidate] !== false;
        }
        return contentEnabled(overlay, item);
      }

      function setContentEnabledForSession(overlay, item, session, enabled) {
        overlay.content ||= {};
        for (const suffix of sessionKeys(session)) {
          overlay.content[`${contentKey(item)}.${suffix}`] = enabled;
        }
      }

      function choice(options, selected, onChange, extraClass = '') {
        return node('div', `segmented ${extraClass}`, { role: 'group' }, options.map((option) => node(
          'button',
          `segment${option === selected ? ' active' : ''}`,
          { type: 'button', 'aria-pressed': option === selected ? 'true' : 'false' },
          [option],
          { click: () => onChange(option) })));
      }

      function toggle(isOn, onChange = null, ariaLabel = null, options = {}) {
        const disabled = options.disabled === true;
        return node('button', `toggle${isOn ? ' on' : ''}${disabled ? ' disabled' : ''}`, { type: 'button', 'aria-pressed': isOn ? 'true' : 'false', 'aria-label': ariaLabel, 'data-evidence-key': options.evidenceKey || null, disabled: disabled ? 'disabled' : null }, [
          node('span', '', {}, [])
        ], { click: () => {
          if (!disabled) onChange?.(!isOn);
        } });
      }

      function checkbox(isOn, onChange = null, attrs = {}) {
        if (onChange) {
          return node('button', `check${isOn ? ' on' : ''}`, {
            type: 'button',
            'aria-pressed': isOn ? 'true' : 'false',
            ...attrs
          }, [], { click: () => onChange(!isOn) });
        }

        return node('span', `check${isOn ? ' on' : ''}`, { 'aria-hidden': 'true', ...attrs }, []);
      }

      function stateChip(isOn, text = null) {
        return node('span', `state-chip ${isOn ? 'on' : 'off'}`, { 'aria-hidden': 'true' }, [text || (isOn ? 'On' : 'Off')]);
      }

      function percentSlider(label, currentValue, min, max, tone, onChange = null) {
        const numeric = Number(currentValue);
        const minimum = Number(min);
        const maximum = Number(max);
        const value = clampPercent(Number.isFinite(numeric) ? numeric : maximum, minimum, maximum);
        const fillPercent = percentFill(value, minimum, maximum);
        return node('div', `slider-control-group ${tone}`, {}, [
          node('div', `slider ${tone}`, {}, [
            node('input', 'slider-track', {
              type: 'range',
              min: String(minimum),
              max: String(maximum),
              step: '1',
              value: String(value),
              'aria-label': label,
              'aria-valuetext': `${value}%`,
              style: `--slider-fill:${fillPercent.toFixed(1)}%;`
            }, [], {
              input: (event) => {
                const selectedValue = clampPercent(Number(event.target.value), minimum, maximum);
                const selectedFill = percentFill(selectedValue, minimum, maximum);
                event.target.style.setProperty('--slider-fill', `${selectedFill.toFixed(1)}%`);
                event.target.setAttribute('aria-valuetext', `${selectedValue}%`);
                const valueEl = event.target.closest('.slider-control-group')?.querySelector('.field-value');
                if (valueEl) valueEl.textContent = `${selectedValue}%`;
              },
              change: (event) => {
                onChange?.(clampPercent(Number(event.target.value), minimum, maximum));
              }
            })
          ]),
          node('strong', 'field-value', {}, [`${value}%`])
        ]);
      }

      function clampPercent(value, min, max) {
        const rounded = Math.round(Number(value));
        const fallback = Number.isFinite(max) ? max : 100;
        const numeric = Number.isFinite(rounded) ? rounded : fallback;
        return Math.max(min, Math.min(max, numeric));
      }

      function clampInteger(value, fallback, min, max) {
        const rounded = Math.round(Number(value));
        const numeric = Number.isFinite(rounded) ? rounded : fallback;
        return Math.max(min, Math.min(max, numeric));
      }

      function percentFill(value, min, max) {
        return max <= min ? 100 : ((value - min) / (max - min)) * 100;
      }

      function stepper(label, min = 0, max = 10, value = 0, onChange = null) {
        return node('div', 'stepper', {}, [
          button('-', () => onChange?.(Math.max(min, value - 1))),
          node('strong', 'field-value', {}, [label]),
          button('+', () => onChange?.(Math.min(max, value + 1)))
        ]);
      }

      function inputBox(value, enabled, onInput = null, className = '', attrs = {}) {
        return node('input', `text-input ${className}`.trim(), { type: 'text', value, ...attrs, disabled: enabled ? null : 'disabled' }, [], {
          input: (event) => onInput?.(event.target.value)
        });
      }

      function button(label, onClick = null, attrs = {}) {
        const disabled = attrs.disabled === true;
        const style = settingsActionButtonStyle(attrs);
        return node('button', `action-button${disabled ? ' disabled' : ''}`, { type: 'button', ...attrs, style, disabled: disabled ? 'disabled' : null }, [label], { click: (event) => {
          if (!disabled) onClick?.(event);
        } });
      }

      function settingsActionButtonStyle(attrs) {
        const key = attrs?.['data-evidence-key'];
        const widthVariable = {
          'general.updates.check': '--tmr-settings-update-check-button-width',
          'general.updates.primary': '--tmr-settings-update-primary-button-width',
          'support.bundle.create': '--tmr-settings-support-create-bundle-button-width',
          'support.bundle.open-folder': '--tmr-settings-support-open-bundle-button-width',
          'garage-cover.general.cover-image.import': '--tmr-settings-garage-import-button-width',
          'garage-cover.general.cover-image.clear': '--tmr-settings-garage-clear-button-width',
          'stream-chat.content.save': '--tmr-settings-stream-chat-save-button-width'
        }[key];
        const widthStyle = widthVariable ? `width: var(${widthVariable})` : null;
        return [attrs?.style, widthStyle].filter(Boolean).join('; ') || null;
      }

      async function copyBrowserSourceUrl(url, buttonEl) {
        try {
          await copyTextToClipboard(url);
          showCopyButtonState(buttonEl, 'Copied');
        } catch {
          showCopyButtonState(buttonEl, 'Copy failed');
        }
      }

      async function copyTextToClipboard(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'readonly');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.append(textarea);
        textarea.select();
        try {
          if (!document.execCommand('copy')) {
            throw new Error('copy failed');
          }
        } finally {
          textarea.remove();
        }
      }

      function showCopyButtonState(buttonEl, text) {
        if (!buttonEl) return;
        const previous = buttonEl.textContent || 'Copy';
        buttonEl.textContent = text;
        window.setTimeout(() => {
          buttonEl.textContent = previous;
        }, 1400);
      }

      function closeSettingsReview() {
        window.close();
        window.setTimeout(() => {
          if (document.visibilityState === 'hidden') return;
          app.replaceChildren(node('section', 'settings-closed', {}, [
            node('h1', '', {}, ['Settings preview closed']),
            node('button', 'action-button', { type: 'button' }, ['Reopen'], { click: () => render() })
          ]));
        }, 0);
      }

      function setRawCaptureEnabled(isOn) {
        state.support.rawCaptureEnabled = isOn;
        setSupportStatus(isOn ? 'Enhanced capture will save forensics at session end.' : 'Enhanced iRacing telemetry capture disabled.', 'success');
        persistSettings({ kind: 'support', action: 'rawCapture', enabled: isOn });
        render();
      }

      function trackMapOverlay() {
        return config.overlays.find((overlay) => overlay.id === 'track-map') || null;
      }

      function trackMapBuildFromTelemetryEnabled() {
        const overlay = trackMapOverlay();
        return overlay
          ? contentEnabled(overlay, { label: 'Local map building', key: 'track-map.build-from-telemetry', defaultEnabled: true })
          : true;
      }

      function setTrackMapBuildFromTelemetry(isOn) {
        const overlay = trackMapOverlay();
        if (overlay) {
          overlay.content ||= {};
          overlay.content['track-map.build-from-telemetry'] = isOn;
        }
        setSupportStatus(isOn ? 'Local map building enabled.' : 'Local map building disabled.', 'success');
        persistSettings({ kind: 'content', overlayId: 'track-map', key: 'track-map.build-from-telemetry', label: 'Local map building', enabled: isOn });
        render();
      }

      function createReviewDiagnosticsBundle() {
        const path = '/tmp/tmr-overlay-review/diagnostics/review-diagnostics-bundle.zip';
        state.support.latestBundlePath = path;
        setSupportStatus('Created diagnostics bundle.', 'success');
        persistSettings({ kind: 'support', action: 'createBundle', path });
        render();
      }

      async function copyLatestReviewBundlePath() {
        const path = state.support.latestBundlePath || '';
        if (!path) {
          setSupportStatus('No diagnostics bundle yet.', 'error');
          persistSettings({ kind: 'support', action: 'copyBundlePath', ok: false, reason: 'missingBundle' });
          render();
          return;
        }

        try {
          await copyTextToClipboard(path);
          setSupportStatus('Copied bundle path.', 'success');
          persistSettings({ kind: 'support', action: 'copyBundlePath', ok: true });
        } catch {
          setSupportStatus('Clipboard unavailable. Select the path instead.', 'error');
          persistSettings({ kind: 'support', action: 'copyBundlePath', ok: false, reason: 'clipboardUnavailable' });
        }
        render();
      }

      function latestBundleDisplayText(path) {
        if (!path) return 'No bundle yet';
        const normalized = String(path).replaceAll('\\\\', '/');
        const fileName = normalized.split('/').filter(Boolean).pop();
        return fileName ? compactMiddle(fileName, latestBundleValueMaxLength) : 'Bundle ready';
      }

      function compactMiddle(value, maxLength) {
        const text = String(value || '');
        if (text.length <= maxLength) return text;

        const ellipsis = '...';
        const suffixLength = Math.min(15, maxLength - ellipsis.length - 1);
        const prefixLength = maxLength - ellipsis.length - suffixLength;
        if (prefixLength <= 0) return text.slice(0, maxLength);

        return `${text.slice(0, prefixLength)}${ellipsis}${text.slice(-suffixLength)}`;
      }

      function checkReviewUpdates() {
        state.support.updateText = 'No update available.';
        setSupportStatus('Checked for updates.', 'success');
        persistSettings({ kind: 'support', action: 'checkUpdates' });
        render();
      }

      function runSupportAction(action, message) {
        setSupportStatus(message, 'success');
        persistSettings({ kind: 'support', action });
        render();
      }

      function setSupportStatus(text, tone = 'neutral') {
        state.support.statusText = text;
        state.support.statusTone = tone;
      }

      function regionTitle(region) {
        return region[0].toUpperCase() + region.slice(1);
      }

      function formatCarCount(value) {
        const count = Number(value);
        if (!Number.isFinite(count)) return '';
        return count === 1 ? '1 car' : `${count} cars`;
      }

      function previewChoice(mode) {
        return mode === 'qualifying' ? 'Quali' : mode === 'race' ? 'Race' : mode === 'practice' ? 'Practice' : 'Off';
      }

      function previewModeFromChoice(choiceName) {
        return choiceName === 'Quali' ? 'qualifying' : choiceName.toLowerCase();
      }

      function previewLabel(mode) {
        return mode === 'off' ? 'Preview off' : `${mode === 'qualifying' ? 'Qualifying' : regionTitle(mode)} preview active`;
      }

      function slugEvidenceKey(value) {
        return String(value || '')
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'control';
      }

      function updateToneClass(tone) {
        return ['success', 'warning', 'error', 'info', 'muted'].includes(tone) ? tone : 'muted';
      }

      function sessionKey(label) {
        const normalized = String(label || '').trim().toLowerCase();
        if (normalized === 'test') return 'practice';
        return normalized === 'qual' ? 'qualifying' : normalized;
      }

      function normalizedSessionLabels(labels) {
        const normalized = [];
        const seen = new Set();
        for (const label of Array.isArray(labels) ? labels : []) {
          const key = sessionKey(label);
          if (!['practice', 'qualifying', 'race'].includes(key) || seen.has(key)) {
            continue;
          }

          seen.add(key);
          normalized.push(key === 'qualifying' ? 'Qualifying' : regionTitle(key));
        }

        return normalized.length > 0 ? normalized : ['Practice', 'Qualifying', 'Race'];
      }

      function applySessionLayoutVars() {
        const count = Math.max(1, sessionLabels.length);
        const sessionCheckColumnWidth = settingsGeometryNumber('sessionCheckColumnWidth', 100);
        const sessionCheckColumnGap = settingsGeometryNumber('sessionCheckColumnGap', 16);
        const sessionColumnWidth = settingsGeometryNumber('sessionColumnWidth', 104);
        const compactSessionColumnWidth = settingsGeometryNumber('compactSessionColumnWidth', 24);
        app.style.setProperty('--settings-session-check-grid', `repeat(${count}, minmax(0, ${sessionCheckColumnWidth}px))`);
        app.style.setProperty('--settings-session-check-min-width', `${count * sessionCheckColumnWidth + Math.max(0, count - 1) * sessionCheckColumnGap}px`);
        app.style.setProperty('--settings-session-columns', `repeat(${count}, ${sessionColumnWidth}px)`);
        app.style.setProperty('--settings-compact-session-columns', `repeat(${count}, ${compactSessionColumnWidth}px)`);
      }

      function applyReviewScale() {
        const scale = Math.max(
          0.25,
          Math.min(
            1,
            (window.innerWidth - 20) / designWidth,
            (window.innerHeight - 20) / designHeight
          )
        );
        app.style.setProperty('--settings-review-scale', scale.toFixed(4));
        if (scaleFrame) {
          scaleFrame.style.width = `${Math.ceil(designWidth * scale)}px`;
          scaleFrame.style.height = `${Math.ceil(designHeight * scale)}px`;
        }
      }

      function sessionColumnStyle(labels) {
        const count = Math.max(1, labels.length);
        return `--settings-session-columns: repeat(${count}, ${settingsGeometryNumber('sessionColumnWidth', 104)}px);`;
      }

      function settingsGeometryNumber(key, fallback) {
        const value = Number(settingsGeometry?.[key]);
        return Number.isFinite(value) ? value : fallback;
      }

      function chromeSessionLabels(overlay) {
        return overlay?.id === 'gap-to-leader' ? ['Race'] : sessionLabels;
      }

      function compactSessionLabel(label) {
        const key = sessionKey(label);
        if (key === 'practice') return 'P';
        if (key === 'qualifying') return 'Q';
        if (key === 'race') return 'R';
        return String(label || '').slice(0, 1).toUpperCase();
      }

      function sessionKeys(label) {
        const key = sessionKey(label);
        return key === 'practice' ? ['practice', 'test'] : [key];
      }

      function browserSize(overlay) {
        const base = browserBaseSize(overlay?.id);
        if (overlay?.id === 'input-state') {
          base[0] = inputStateBaseWidth(overlay, base[0]);
        } else if (overlay?.id === 'gap-to-leader') {
          const gapSize = gapToLeaderBaseSize(overlay, base[0], base[1]);
          base[0] = gapSize[0];
          base[1] = gapSize[1];
        } else if (overlay?.id === 'fuel-calculator') {
          base[1] = fuelCalculatorBaseHeight(overlay, base[1]);
        } else if (overlay?.id === 'standings' || overlay?.id === 'relative') {
          base[0] = tableBaseWidth(overlay, base[0]);
          if (overlay.id === 'relative') {
            base[1] = relativeBaseHeight(overlay, base[1]);
          }
        } else if (overlay?.id === 'session-weather' || overlay?.id === 'pit-service') {
          const simpleSize = simpleTelemetryBaseSize(overlay, base[0], base[1]);
          base[0] = simpleSize[0];
          base[1] = simpleSize[1];
        }
        base[1] = chromeAdjustedBaseHeight(overlay, base[1]);
        const scale = Math.max(0.6, Math.min(2, Number(overlay?.scalePercent || 100) / 100));
        return `${Math.round(base[0] * scale)} x ${Math.round(base[1] * scale)}`;
      }

      function browserBaseSize(overlayId) {
        return {
          standings: [
            overlaySizeNumber('standingsBrowserReviewWidth', overlaySizeNumber('standingsWidth', 677)),
            overlaySizeNumber('standingsHeight', 313)
          ],
          relative: [overlaySizeNumber('relativeWidth', 360), overlaySizeNumber('relativeHeight', 308)],
          'gap-to-leader': [overlaySizeNumber('gapToLeaderWidth', 654), overlaySizeNumber('gapToLeaderHeight', 336)],
          'track-map': [overlaySizeNumber('trackMapWidth', 360), overlaySizeNumber('trackMapHeight', 360)],
          'stream-chat': [overlaySizeNumber('streamChatWidth', 380), overlaySizeNumber('streamChatHeight', 520)],
          'garage-cover': [overlaySizeNumber('garageCoverWidth', 1280), overlaySizeNumber('garageCoverHeight', 720)],
          'fuel-calculator': [overlaySizeNumber('fuelCalculatorWidth', 503), overlaySizeNumber('fuelCalculatorHeight', 315)],
          'input-state': [overlaySizeNumber('inputStateWidth', 520), overlaySizeNumber('inputStateHeight', 260)],
          'car-radar': [overlaySizeNumber('carRadarWidth', 300), overlaySizeNumber('carRadarHeight', 300)],
          flags: [overlaySizeNumber('flagsWidth', 360), overlaySizeNumber('flagsHeight', 170)],
          'session-weather': [overlaySizeNumber('sessionWeatherWidth', 464), overlaySizeNumber('sessionWeatherHeight', 496)],
          'pit-service': [overlaySizeNumber('pitServiceWidth', 530), overlaySizeNumber('pitServiceHeight', 707)]
        }[overlayId] || [400, 300];
      }

      function fuelCalculatorBaseHeight(overlay, fullHeight) {
        const session = sizingSession(overlay);
        if (session === 'practice' || session === 'qualifying') {
          const rows = [
            ['fuel-calculator.range.fuel.enabled', 'Fuel range'],
            ['fuel-calculator.usage.enabled', 'Fuel usage']
          ].filter(([key, label]) => contentEnabledForSession(overlay, { key, label, defaultEnabled: true }, session)).length;
          return fuelCalculatorContentHeight(rows, rows) || metricGeometryNumber('fuelNonRaceHeight', 184);
        }

        const showPlan = contentEnabledForSession(overlay, { key: 'fuel-calculator.race.plan.enabled', label: 'Plan', defaultEnabled: true }, session);
        const showFuel = contentEnabledForSession(overlay, { key: 'fuel-calculator.race.fuel.enabled', label: 'Fuel', defaultEnabled: true }, session);
        const showStints = contentEnabledForSession(overlay, { key: 'fuel-calculator.race.stint-targets.enabled', label: 'Stint targets', defaultEnabled: true }, session);
        const raceRows = (showPlan ? 1 : 0) + (showFuel ? 1 : 0);
        const stintRows = showStints ? 3 : 0;
        const sectionCount = (raceRows > 0 ? 1 : 0) + (stintRows > 0 ? 1 : 0);
        return fuelCalculatorContentHeight(raceRows + stintRows, sectionCount) || fullHeight;
      }

      function fuelCalculatorContentHeight(rowCount, sectionCount) {
        const minimumHeight = metricGeometryNumber('minimumFuelCalculatorHeight', 126);
        if (rowCount <= 0 || sectionCount <= 0) return minimumHeight;
        const rowGaps = Math.max(0, rowCount - sectionCount) * metricGeometryNumber('rowGap', 5);
        const sectionGaps = Math.max(0, sectionCount - 1) * metricGeometryNumber('sectionGap', 8);
        const height = metricGeometryNumber('headerChromeHeight', 38)
          + metricGeometryNumber('fuelContentVerticalPadding', 26)
          + sectionCount * metricGeometryNumber('fuelSectionTitleReserveHeight', 14)
          + rowCount * metricGeometryNumber('segmentedRowHeight', 35)
          + rowGaps
          + sectionGaps
          + metricGeometryNumber('collapsedFooterReserveHeight', 8);
        return Math.max(minimumHeight, Math.min(315, height));
      }

      function chromeAdjustedBaseHeight(overlay, fullHeight) {
        const titleHeaderHeight = overlay?.id === 'relative'
          ? overlaySizeNumber('relativeHeaderChromeCollapseHeight', 34)
          : metricGeometryNumber('headerChromeHeight', 38);
        const minimumHeaderlessHeight = metricGeometryNumber('minimumChromeAdjustedHeight', 80);
        if (!usesCollapsibleHeaderHeight(overlay?.id) || headerChromeEnabledForSizing(overlay)) {
          return fullHeight;
        }

        return Math.max(minimumHeaderlessHeight, fullHeight - titleHeaderHeight);
      }

      function usesCollapsibleHeaderHeight(overlayId) {
        return [
          'standings',
          'relative',
          'gap-to-leader',
          'fuel-calculator',
          'session-weather',
          'pit-service'
        ].includes(overlayId);
      }

      function headerChromeEnabledForSizing(overlay) {
        if (!overlay?.supportsChrome) {
          return false;
        }

        return chromeEnabledReadonly(overlay, 'Header', 'Time remaining', sizingSession(overlay));
      }

      function chromeEnabledReadonly(overlay, area, label, session) {
        const key = area.toLowerCase();
        const sessionSuffix = sessionKey(session);
        return overlay?.chrome?.[key]?.[label]?.[sessionSuffix] !== false;
      }

      function sizingSession(overlay) {
        if (state.previewMode !== 'off') {
          return state.previewMode;
        }

        return null;
      }

      function tableBaseWidth(overlay, fullWidth) {
        const session = sizingSession(overlay);
        const widths = tableColumnWidths(overlay?.id);
        const rows = overlay?.contentRows || [];
        let visibleWidth = rows
          .filter((item) => contentEnabledForSession(overlay, item, session))
          .reduce((total, item) => total + (widths[item.label] || 0), 0);
        if (visibleWidth <= 0 && overlay?.id !== 'relative' && widths.Driver) {
          visibleWidth = widths.Driver;
        }
        if (visibleWidth <= 0) return fullWidth;
        return visibleWidth + tableGeometryNumber('browserWidthPadding', 34);
      }

      function tableColumnWidths(overlayId) {
        return {
          standings: {
            'Class position': tableGeometryNumber('standingsClassPositionWidth', 35),
            'Car number': tableGeometryNumber('standingsCarNumberWidth', 50),
            Driver: tableGeometryNumber('standingsDriverWidth', 250),
            'Class gap': tableGeometryNumber('standingsClassGapWidth', 60),
            'Previous interval': tableGeometryNumber('standingsPreviousIntervalWidth', 60),
            'Fastest lap': tableGeometryNumber('standingsFastestLapWidth', 70),
            'Last lap': tableGeometryNumber('standingsLastLapWidth', 70),
            'Pit status': tableGeometryNumber('standingsPitStatusWidth', 48)
          },
          relative: {
            'Relative position': tableGeometryNumber('relativePositionWidth', 48),
            Driver: tableGeometryNumber('relativeDriverWidth', 240),
            'Relative delta': tableGeometryNumber('relativeDeltaWidth', 70),
            'Pit status': tableGeometryNumber('relativePitStatusWidth', 48)
          }
        }[overlayId] || {};
      }

      function relativeBaseHeight(overlay, fullHeight) {
        const carsEachSide = Math.max(0, Math.min(8, Number(overlay?.carsEachSide ?? 3)));
        const rows = carsEachSide * 2 + 1;
        return Math.max(
          tableGeometryNumber('relativeMinimumHeight', 160),
          tableGeometryNumber('relativeHeightChrome', 96)
            + rows * tableGeometryNumber('relativeRowHeight', 26)
            + Math.max(0, rows - 1) * tableGeometryNumber('relativeRowGap', 5));
      }

      function simpleTelemetryBaseSize(overlay, fullWidth, fullHeight) {
        const session = sizingSession(overlay);
        const rows = overlay?.contentRows || [];
        if (overlay?.id === 'pit-service') {
          return pitServiceBaseSize(rows, overlay, fullWidth, fullHeight, session);
        }

        const sessionFullHeight = simpleTelemetryFullHeightForSizingSession(overlay, fullHeight, session);
        const defaultCount = rows.filter((item) => item.defaultEnabled !== false).length;
        const enabledCount = rows.filter((item) => contentEnabledForSession(overlay, item, session)).length;
        if (enabledCount <= 0 || enabledCount >= defaultCount || defaultCount <= 1) {
          return [fullWidth, sessionFullHeight];
        }

        const progress = (enabledCount - 1) / Math.max(1, defaultCount - 1);
        const minimumHeight = metricGeometryNumber('minimumSimpleTelemetryHeight', 184);
        const compactHeight = minimumHeight + Math.round((sessionFullHeight - minimumHeight) * progress);
        return [
          Math.min(fullWidth, metricGeometryNumber('minimumSimpleTelemetryWidth', 464)),
          Math.max(minimumHeight, Math.min(sessionFullHeight, compactHeight))
        ];
      }

      function pitServiceBaseSize(rows, overlay, fullWidth, fullHeight, session) {
        const enabled = new Set(rows
          .filter((item) => contentEnabledForSession(overlay, item, session))
          .map((item) => item.label));
        if (enabled.size <= 0) {
          return [fullWidth, metricGeometryNumber('minimumSimpleTelemetryHeight', 184)];
        }

        const sectionHeights = [];
        const sessionRows = enabled.has('Session time') || (session === 'race' && enabled.has('Session laps')) ? 1 : 0;
        addMetricSectionHeight(sectionHeights, sessionRows, sessionRows);
        const signalRows = Number(enabled.has('Release')) + Number(enabled.has('Pit status'));
        addMetricSectionHeight(sectionHeights, signalRows, signalRows);
        let serviceRows = 0;
        if (enabled.has('Fuel requested') || enabled.has('Fuel selected')) serviceRows += 1;
        if (enabled.has('Tearoff requested')) serviceRows += 1;
        if (enabled.has('Required repair') || enabled.has('Optional repair')) serviceRows += 1;
        if (enabled.has('Fast repair selected') || enabled.has('Fast repairs available')) serviceRows += 1;
        addMetricSectionHeight(sectionHeights, serviceRows, serviceRows);
        const metricHeight = sectionHeights.reduce((total, value) => total + value, 0)
          + Math.max(0, sectionHeights.length - 1) * metricGeometryNumber('pitServiceSectionGap', 3);
        const tireRows = [
          'Compound',
          'Change request',
          'Set limit',
          'Sets available',
          'Sets used',
          'Pressure',
          'Temperature',
          'Wear',
          'Distance'
        ].filter((label) => enabled.has(label)).length;
        const gridHeight = tireRows <= 0
          ? 0
          : metricGeometryNumber('metricGridHeaderHeight', 20)
            + metricGeometryNumber('metricGridHeaderBottomGap', 4)
            + tireRows * metricGeometryNumber('metricGridRowHeight', 29)
            + Math.max(0, tireRows - 1) * metricGeometryNumber('metricGridRowGap', 4);
        const contentHeight = metricHeight
          + (metricHeight > 0 && gridHeight > 0 ? metricGeometryNumber('metricGridGap', 8) : 0)
          + gridHeight;
        const width = tireRows > 0 ? fullWidth : Math.min(fullWidth, metricGeometryNumber('pitServiceMetricOnlyWidth', 454));
        const minimumHeight = metricGeometryNumber('minimumSimpleTelemetryHeight', 184);
        return [width, Math.max(minimumHeight, Math.min(fullHeight, contentHeight + metricGeometryNumber('pitServiceContentChromeHeight', 70)))];
      }

      function addMetricSectionHeight(sectionHeights, rowCount, segmentedRows) {
        if (rowCount <= 0) return;
        const plainRows = Math.max(0, rowCount - segmentedRows);
        sectionHeights.push(
          metricGeometryNumber('sectionTitleHeight', 11)
          + metricGeometryNumber('sectionTitleBottomGap', 4)
          + segmentedRows * metricGeometryNumber('segmentedRowHeight', 35)
          + plainRows * metricGeometryNumber('plainRowHeight', 30)
          + Math.max(0, rowCount - 1) * metricGeometryNumber('rowGap', 5)
        );
      }

      function metricGeometryNumber(key, fallback) {
        const value = Number(metricRowsGeometry?.[key]);
        return Number.isFinite(value) ? value : fallback;
      }

      function overlaySizeNumber(key, fallback) {
        const value = Number(overlaySizes?.[key]);
        return Number.isFinite(value) ? value : fallback;
      }

      function tableGeometryNumber(key, fallback) {
        const value = Number(tableGeometry?.[key]);
        return Number.isFinite(value) ? value : fallback;
      }

      function simpleTelemetryFullHeightForSizingSession(overlay, fullHeight, session) {
        if (overlay?.id === 'session-weather' && (session === 'practice' || session === 'qualifying')) {
          return Math.max(
            metricGeometryNumber('minimumSimpleTelemetryHeight', 184),
            fullHeight - metricGeometryNumber('nonRaceSimpleTelemetryHeightReduction', 40));
        }

        return fullHeight;
      }

      function inputStateBaseWidth(overlay, fullWidth) {
        const session = sizingSession(overlay);
        const hasGraph = contentEnabledForSession(overlay, { label: 'Throttle trace', key: 'input-state.trace.throttle', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Brake trace', key: 'input-state.trace.brake', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Clutch trace', key: 'input-state.trace.clutch', defaultEnabled: true }, session);
        const hasRail = contentEnabledForSession(overlay, { label: 'Throttle %', key: 'input-state.current.throttle', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Brake %', key: 'input-state.current.brake', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Clutch %', key: 'input-state.current.clutch', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Steering wheel', key: 'input-state.current.steering', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Gear', key: 'input-state.current.gear', defaultEnabled: true }, session)
          || contentEnabledForSession(overlay, { label: 'Speed', key: 'input-state.current.speed', defaultEnabled: true }, session);
        if (hasGraph && hasRail) return fullWidth;
        if (hasGraph) return 380;
        return 276;
      }

      function gapToLeaderBaseSize(overlay, fullWidth, fullHeight) {
        const session = sizingSession(overlay);
        const carsEnabled = Number(overlay?.carsAhead ?? 5) > 0 || Number(overlay?.carsBehind ?? 5) > 0;
        const hasGraph = carsEnabled && contentEnabledForSession(overlay, { label: 'Graph', key: 'gap.graph.enabled', defaultEnabled: true }, session);
        const hasTrend = [
          { label: 'Last', key: 'gap.trend.last.enabled' },
          { label: '5L', key: 'gap.trend.5l.enabled' },
          { label: '10L', key: 'gap.trend.10l.enabled' },
          { label: 'Pit', key: 'gap.trend.pit.enabled' },
          { label: 'PLap', key: 'gap.trend.pit-lap.enabled' },
          { label: 'Stint', key: 'gap.trend.stint.enabled' },
          { label: 'Tire', key: 'gap.trend.tire.enabled' },
          { label: 'Status', key: 'gap.trend.status.enabled' }
        ].some((item) => contentEnabledForSession(overlay, { ...item, defaultEnabled: true }, session));
        if (!hasGraph && !hasTrend) {
          return [
            overlaySizeNumber('gapToLeaderMinimumWidth', 360),
            overlaySizeNumber('gapToLeaderMinimumHeight', 196)
          ];
        }
        if (!hasGraph) return [overlaySizeNumber('gapToLeaderTrendOnlyWidth', 360), fullHeight];
        if (!hasTrend) return [overlaySizeNumber('gapToLeaderGraphOnlyWidth', 444), fullHeight];
        return [fullWidth, fullHeight];
      }

      function chromeEnabled(overlay, area, label, session) {
        const key = area.toLowerCase();
        overlay.chrome ||= {};
        overlay.chrome[key] ||= {};
        overlay.chrome[key][label] ||= {};
        return overlay.chrome[key][label][sessionKey(session)] !== false;
      }

      function setChromeEnabled(overlay, area, label, session, enabled) {
        const key = area.toLowerCase();
        overlay.chrome ||= {};
        overlay.chrome[key] ||= {};
        overlay.chrome[key][label] ||= {};
        for (const suffix of sessionKeys(session)) {
          overlay.chrome[key][label][suffix] = enabled;
        }
      }

      function persistSettings(patch) {
        fetch('/api/review/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch)
        }).catch(() => {});
      }

      function node(tag, className, attrs, children, events = {}) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        for (const [name, value] of Object.entries(attrs || {})) {
          if (value === null || value === undefined) continue;
          element.setAttribute(name, value);
        }
        for (const child of children || []) {
          if (child === null || child === undefined || child === false) continue;
          element.append(child instanceof Node ? child : document.createTextNode(String(child)));
        }
        for (const [name, handler] of Object.entries(events || {})) {
          element.addEventListener(name, handler);
        }
        return element;
      }

      render();
      syncUrl();
    })();
  </script>
</body>
</html>

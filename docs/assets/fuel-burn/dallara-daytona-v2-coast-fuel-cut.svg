<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}
.title{font-size:20px;font-weight:700}
.subtitle{font-size:12px;fill:#64748b}
.axis{font-size:12px;fill:#334155}
.tick{font-size:11px;fill:#64748b}
.legend{font-size:12px;fill:#334155}
</style>
<rect width="820" height="460" fill="#ffffff"/>
<text class="title" x="90" y="30">Lift-and-coast is a distinct fuel-cut regime</text>
<text class="subtitle" x="90" y="50">Median fuel flow is zero for in-gear lift and clutch/neutral coast samples</text>
<line x1="90" y1="360" x2="770" y2="360" stroke="#0f172a" stroke-width="1"/>
<line x1="90" y1="70" x2="90" y2="360" stroke="#0f172a" stroke-width="1"/>
<text class="axis" x="430.0" y="402" text-anchor="middle">Coast regime</text>
<text class="axis" x="18" y="215.0" transform="rotate(-90 18 215.0)" text-anchor="middle">FuelUsePerHour (kg/h)</text>
<line x1="90" y1="360.0" x2="770" y2="360.0" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="364.0" text-anchor="end">0</text>
<line x1="90" y1="311.7" x2="770" y2="311.7" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="315.7" text-anchor="end">2</text>
<line x1="90" y1="263.3" x2="770" y2="263.3" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="267.3" text-anchor="end">4</text>
<line x1="90" y1="215.0" x2="770" y2="215.0" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="219.0" text-anchor="end">6</text>
<line x1="90" y1="166.7" x2="770" y2="166.7" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="170.7" text-anchor="end">8</text>
<line x1="90" y1="118.3" x2="770" y2="118.3" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="122.3" text-anchor="end">10</text>
<line x1="90" y1="70.0" x2="770" y2="70.0" stroke="#d8dee8" stroke-width="1"/>
<text class="tick" x="80" y="74.0" text-anchor="end">12</text>
<rect x="158.3" y="353.4" width="41" height="6.6" fill="#2563eb" opacity="0.75"/>
<rect x="207.3" y="338.0" width="41" height="22.0" fill="#2563eb" opacity="0.28"/>
<text class="tick" x="203.3" y="378" text-anchor="middle">lift in gear</text>
<text class="tick" x="181.3" y="347.4" text-anchor="middle">0.28</text>
<text class="tick" x="229.3" y="332.0" text-anchor="middle">0.91</text>
<rect x="385.0" y="359.8" width="41" height="0.2" fill="#7c3aed" opacity="0.75"/>
<rect x="434.0" y="360.0" width="41" height="0.0" fill="#7c3aed" opacity="0.28"/>
<text class="tick" x="430.0" y="378" text-anchor="middle">clutch/neutral coast</text>
<text class="tick" x="408.0" y="353.8" text-anchor="middle">0.01</text>
<text class="tick" x="456.0" y="354.0" text-anchor="middle">0.00</text>
<rect x="611.7" y="204.6" width="41" height="155.4" fill="#ea580c" opacity="0.75"/>
<rect x="660.7" y="146.5" width="41" height="213.5" fill="#ea580c" opacity="0.28"/>
<text class="tick" x="656.7" y="378" text-anchor="middle">tiny throttle</text>
<text class="tick" x="634.7" y="198.6" text-anchor="middle">6.43</text>
<text class="tick" x="682.7" y="140.5" text-anchor="middle">8.84</text>
<rect x="585" y="82" width="18" height="12" fill="#2563eb" opacity="0.75"/><text class="legend" x="610" y="93">mean</text>
<rect x="585" y="104" width="18" height="12" fill="#2563eb" opacity="0.28"/><text class="legend" x="610" y="115">p90</text>
</svg>

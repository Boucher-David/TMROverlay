name: Build/Test

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  VELOPACK_VERSION: 0.0.1589-ga2c5a97

jobs:
  browser_review_tests:
    name: Browser review tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Test browser review data contracts
        run: npm run test:browser

  localhost_tests:
    name: Localhost route tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Test localhost overlay routes
        run: npm run test:localhost

  settings_effect_tests:
    name: Settings effect matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Validate settings effect matrix
        run: npm run test:settings-effects

  overlay_evidence_contract_tests:
    name: Overlay evidence contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Validate overlay evidence contract
        run: npm run test:evidence-contract

  javascript_coverage:
    name: JavaScript coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Collect Vitest coverage
        run: npm run test:coverage:js

      - name: Add JavaScript coverage summary
        if: always()
        run: node tools/ci/summarize-vitest-coverage.mjs

      - name: Upload JavaScript coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: javascript-coverage
          path: coverage/js
          if-no-files-found: error
          retention-days: 14

  browser_review_screenshots:
    name: Browser review screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser screenshot dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Generate browser review screenshots
        run: npm run screenshots:browser-review -- --output artifacts/browser-review-screenshots

      - name: Validate browser review screenshots
        id: validate_browser_review
        continue-on-error: true
        run: python3 tools/validate_overlay_screenshots.py --profile browser-review-ci --root artifacts/browser-review-screenshots

      - name: Upload browser review screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-review-screenshots
          path: artifacts/browser-review-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Fail on browser review screenshot validation
        if: ${{ steps.validate_browser_review.outcome == 'failure' }}
        run: exit 1

  localhost_screenshots:
    name: Localhost screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install browser screenshot dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Generate localhost screenshots
        run: npm run screenshots:localhost -- --output artifacts/localhost-screenshots

      - name: Validate localhost screenshots
        id: validate_localhost
        continue-on-error: true
        run: python3 tools/validate_overlay_screenshots.py --profile localhost-ci --root artifacts/localhost-screenshots

      - name: Upload localhost screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: localhost-screenshots
          path: artifacts/localhost-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Fail on localhost screenshot validation
        if: ${{ steps.validate_localhost.outcome == 'failure' }}
        run: exit 1

  windows_static_validation:
    name: Windows static validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python validation dependencies
        run: python -m pip install PyYAML

      - name: Validate active screenshot contracts
        run: python tools/validate_overlay_screenshots.py --profile app-static

      - name: Test overlay validation tool units
        run: python -m unittest discover -s tests/tools -p "test_*.py"

      - name: Validate release tutorial image
        run: python tools/validate_overlay_screenshots.py --profile release-tutorial --root docs/assets

  windows_build:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tmrOverlay.sln

      - name: Build
        run: dotnet build tmrOverlay.sln --configuration Release --no-restore

  windows_tests:
    name: Windows tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tmrOverlay.sln

      - name: Data contract snapshot tests - localhost/native
        run: dotnet test tests\TmrOverlay.App.Tests\TmrOverlay.App.Tests.csproj --configuration Release --no-restore --filter DataContracts

      - name: Test native app
        shell: pwsh
        run: |
          $results = ".\artifacts\dotnet-test-results\native"
          dotnet test tmrOverlay.sln `
            --configuration Release `
            --no-restore `
            --logger "trx;LogFileName=native.trx" `
            --results-directory $results
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
              .\tools\ci\annotate-dotnet-test-results.ps1 -ResultsDirectory $results
              exit $testExitCode
          }

  dotnet_coverage:
    name: .NET coverage
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tmrOverlay.sln

      - name: Install .NET coverage tools
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Collect .NET coverage
        shell: pwsh
        run: |
          $results = ".\artifacts\dotnet-test-results\coverage"
          $coverageArtifacts = ".\artifacts\coverage\dotnet"
          $rawCoverage = Join-Path $results "coverage.cobertura.xml"
          New-Item -ItemType Directory -Force $results | Out-Null
          New-Item -ItemType Directory -Force $coverageArtifacts | Out-Null

          $dotnetCoverage = Join-Path $env:USERPROFILE ".dotnet\tools\dotnet-coverage.exe"
          $testCommand = 'dotnet test tests\TmrOverlay.App.Tests\TmrOverlay.App.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=coverage.trx" --results-directory artifacts\dotnet-test-results\coverage'
          & $dotnetCoverage collect $testCommand -f cobertura -o $rawCoverage
          $coverageExitCode = $LASTEXITCODE
          if ($coverageExitCode -ne 0) {
              "dotnet-coverage collect exited with code $coverageExitCode." | Out-File -FilePath (Join-Path $coverageArtifacts "coverage-collection-failure.txt") -Encoding utf8
              .\tools\ci\annotate-dotnet-test-results.ps1 -ResultsDirectory $results
              Write-Host "Coverage collection artifacts:"
              Get-ChildItem -Path .\artifacts -Recurse -File | ForEach-Object { Write-Host $_.FullName }
              exit $coverageExitCode
          }

          if (-not (Test-Path -LiteralPath $rawCoverage -PathType Leaf)) {
              "dotnet-coverage collect completed but did not produce $rawCoverage." | Out-File -FilePath (Join-Path $coverageArtifacts "coverage-collection-failure.txt") -Encoding utf8
              throw "No Cobertura coverage file was produced by dotnet-coverage."
          }

      - name: Generate .NET coverage report
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Path .\artifacts\dotnet-test-results -Filter coverage.cobertura.xml -Recurse
          if ($reports.Count -eq 0) {
              throw "No Cobertura coverage files were produced."
          }

          $reportPaths = ($reports | ForEach-Object { $_.FullName }) -join ";"
          $reportGenerator = Join-Path $env:USERPROFILE ".dotnet\tools\reportgenerator.exe"
          & $reportGenerator `
            "-reports:$reportPaths" `
            "-targetdir:artifacts\coverage\dotnet" `
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub" `
            "-assemblyfilters:+TMROverlay;+TmrOverlay.*;-TmrOverlay.App.Tests" `
            "-filefilters:-*.g.cs;-*.Designer.cs"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $summary = "artifacts\coverage\dotnet\SummaryGithub.md"
          if (Test-Path $summary) {
              Get-Content $summary >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Validate .NET coverage assemblies
        shell: pwsh
        run: .\tools\ci\assert-dotnet-coverage-assemblies.ps1 -CoveragePath .\artifacts\coverage\dotnet\Cobertura.xml

      - name: Upload .NET coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-coverage
          path: artifacts/coverage/dotnet
          if-no-files-found: error
          retention-days: 14

  windows_overlay_screenshots:
    name: Windows overlay screenshots
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate Windows overlay screenshots
        shell: pwsh
        run: |
          dotnet run `
            --project .\tools\TmrOverlay.WindowsScreenshots\TmrOverlay.WindowsScreenshots.csproj `
            --configuration Release `
            -- .\artifacts\windows-overlay-screenshots

      - name: Validate Windows overlay screenshots
        id: validate_windows_overlay
        continue-on-error: true
        run: python tools/validate_overlay_screenshots.py --profile windows-ci --root artifacts/windows-overlay-screenshots

      - name: Upload Windows overlay screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-overlay-screenshots
          path: artifacts/windows-overlay-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Fail on Windows overlay screenshot validation
        if: ${{ steps.validate_windows_overlay.outcome == 'failure' }}
        run: exit 1

  windows_installer_screenshots:
    name: Windows installer screenshots
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Compute installer screenshot package metadata
        id: package_metadata
        shell: pwsh
        run: |
          [xml]$buildProps = Get-Content .\Directory.Build.props
          $version = $buildProps.Project.PropertyGroup.VersionPrefix
          $fileVersion = "$version.0"
          $informationalVersion = "$version+${{ github.sha }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "informational_version=$informationalVersion" >> $env:GITHUB_OUTPUT
          "publish_path=.\artifacts\installer-screenshot-publish" >> $env:GITHUB_OUTPUT
          "velopack_path=.\artifacts\installer-screenshot-velopack" >> $env:GITHUB_OUTPUT

      - name: Publish installer screenshot package
        shell: pwsh
        run: |
          dotnet publish .\src\TmrOverlay.App\TmrOverlay.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.package_metadata.outputs.version }} `
            -p:AssemblyVersion=${{ steps.package_metadata.outputs.file_version }} `
            -p:FileVersion=${{ steps.package_metadata.outputs.file_version }} `
            -p:InformationalVersion=${{ steps.package_metadata.outputs.informational_version }} `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "${{ steps.package_metadata.outputs.publish_path }}"

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version "${{ env.VELOPACK_VERSION }}"

      - name: Build installer screenshot MSI
        id: velopack_pack
        shell: pwsh
        run: |
          $vpk = Join-Path $env:USERPROFILE ".dotnet\tools\vpk.exe"
          $velopackPath = "${{ steps.package_metadata.outputs.velopack_path }}"
          New-Item -ItemType Directory -Force -Path $velopackPath | Out-Null

          & $vpk pack `
            --packId "TMROverlay" `
            --packVersion "${{ steps.package_metadata.outputs.version }}" `
            --packDir "${{ steps.package_metadata.outputs.publish_path }}" `
            --mainExe "TMROverlay.exe" `
            --packTitle "Tech Mates Racing Overlay" `
            --packAuthors "Tech Mates Racing" `
            --outputDir $velopackPath `
            --channel "win-x64" `
            --shortcuts "Desktop,StartMenu" `
            --msi `
            --instLocation "Either" `
            --splashImage ".\assets\brand\TMRInstallerSplash.png" `
            --msiBanner ".\assets\brand\TMRMsiBanner.bmp" `
            --msiLogo ".\assets\brand\TMRMsiLogo.bmp" `
            --icon ".\src\TmrOverlay.App\Assets\TmrOverlay.ico"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $msi = Get-ChildItem $velopackPath -Filter "*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) {
              Get-ChildItem $velopackPath | Format-Table Name, Length
              throw "Velopack output is missing the MSI package needed for installer screenshots."
          }
          "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Generate Windows installer screenshots
        shell: pwsh
        run: |
          dotnet run `
            --project .\tools\TmrOverlay.WindowsInstallerScreenshots\TmrOverlay.WindowsInstallerScreenshots.csproj `
            --configuration Release `
            -- "${{ steps.velopack_pack.outputs.msi_path }}" .\artifacts\windows-installer-screenshots

      - name: Validate Windows installer screenshots
        id: validate_windows_installer
        continue-on-error: true
        run: python tools/validate_overlay_screenshots.py --profile windows-installer-ci --root artifacts/windows-installer-screenshots

      - name: Upload Windows installer screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer-screenshots
          path: artifacts/windows-installer-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Fail on Windows installer screenshot validation
        if: ${{ steps.validate_windows_installer.outcome == 'failure' }}
        run: exit 1

  screenshot_manifest_parity:
    name: Screenshot manifest parity
    runs-on: ubuntu-latest
    needs:
      - browser_review_screenshots
      - localhost_screenshots
      - windows_overlay_screenshots
      - windows_installer_screenshots
    if: ${{ always() && !cancelled() }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Download browser review screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: browser-review-screenshots
          path: artifacts/screenshot-manifest-parity/browser-review

      - name: Download localhost screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: localhost-screenshots
          path: artifacts/screenshot-manifest-parity/localhost

      - name: Download Windows overlay screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: windows-overlay-screenshots
          path: artifacts/screenshot-manifest-parity/windows

      - name: Download Windows installer screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: windows-installer-screenshots
          path: artifacts/screenshot-manifest-parity/installer

      - name: Compare screenshot manifests
        shell: bash
        run: |
          set +e
          python3 tools/validate_overlay_screenshots.py --profile screenshot-manifest-parity --root artifacts/screenshot-manifest-parity
          validation_status=$?

          python3 tools/compare_screenshot_manifests.py \
            --browser-root artifacts/screenshot-manifest-parity/browser-review \
            --localhost-root artifacts/screenshot-manifest-parity/localhost \
            --windows-root artifacts/screenshot-manifest-parity/windows \
            --installer-root artifacts/screenshot-manifest-parity/installer \
            --report artifacts/screenshot-manifest-parity/report.md
          detailed_status=$?

          if [ "$validation_status" -ne 0 ] || [ "$detailed_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload screenshot manifest parity report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-manifest-parity-report
          path: artifacts/screenshot-manifest-parity/report.md
          if-no-files-found: ignore
          retention-days: 14

  windows_publish_dry_run:
    name: Windows publish dry run
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish dry run
        id: publish_dry_run
        shell: pwsh
        run: |
          [xml]$buildProps = Get-Content .\Directory.Build.props
          $version = $buildProps.Project.PropertyGroup.VersionPrefix
          $fileVersion = "$version.0"
          $informationalVersion = "$version+${{ github.sha }}"
          $publishPath = ".\artifacts\pr-publish-check"
          $manifestPath = ".\artifacts\pr-publish-check-manifest.txt"

          dotnet publish .\src\TmrOverlay.App\TmrOverlay.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -p:AssemblyVersion=$fileVersion `
            -p:FileVersion=$fileVersion `
            -p:InformationalVersion=$informationalVersion `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishPath

          "publish_path=$publishPath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "informational_version=$informationalVersion" >> $env:GITHUB_OUTPUT

      - name: Audit dry-run publish output
        shell: pwsh
        run: |
          .\tools\ci\audit-windows-publish.ps1 `
            -PublishPath "${{ steps.publish_dry_run.outputs.publish_path }}" `
            -ManifestPath "${{ steps.publish_dry_run.outputs.manifest_path }}" `
            -PackageName "pr-publish-check" `
            -Version "${{ steps.publish_dry_run.outputs.version }}" `
            -InformationalVersion "${{ steps.publish_dry_run.outputs.informational_version }}"

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version "${{ env.VELOPACK_VERSION }}"

      - name: Velopack pack dry run
        shell: pwsh
        run: |
          $vpk = Join-Path $env:USERPROFILE ".dotnet\tools\vpk.exe"
          $velopackPath = ".\artifacts\pr-velopack-check"
          New-Item -ItemType Directory -Force -Path $velopackPath | Out-Null

          & $vpk pack `
            --packId "TMROverlay" `
            --packVersion "${{ steps.publish_dry_run.outputs.version }}" `
            --packDir "${{ steps.publish_dry_run.outputs.publish_path }}" `
            --mainExe "TMROverlay.exe" `
            --packTitle "Tech Mates Racing Overlay" `
            --packAuthors "Tech Mates Racing" `
            --outputDir $velopackPath `
            --channel "win-x64" `
            --shortcuts "Desktop,StartMenu" `
            --msi `
            --instLocation "Either" `
            --splashImage ".\assets\brand\TMRInstallerSplash.png" `
            --msiBanner ".\assets\brand\TMRMsiBanner.bmp" `
            --msiLogo ".\assets\brand\TMRMsiLogo.bmp" `
            --icon ".\src\TmrOverlay.App\Assets\TmrOverlay.ico"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $msi = Get-ChildItem $velopackPath -Filter "*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $fullPackage = Get-ChildItem $velopackPath -Filter "*${{ steps.publish_dry_run.outputs.version }}*-full.nupkg" | Select-Object -First 1
          $releaseIndex = Join-Path $velopackPath "releases.win-x64.json"
          if ($null -eq $msi -or $null -eq $fullPackage -or !(Test-Path $releaseIndex)) {
              Get-ChildItem $velopackPath | Format-Table Name, Length
              throw "Velopack dry run output is missing the MSI package, full package, or releases.win-x64.json."
          }

  windows_release_package:
    name: Windows release package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - windows_static_validation
      - windows_build
      - windows_tests
      - dotnet_coverage
      - javascript_coverage
      - windows_overlay_screenshots
      - windows_installer_screenshots
      - windows_publish_dry_run
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Compute release metadata
        id: release_metadata
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          [xml]$buildProps = Get-Content .\Directory.Build.props
          $branchVersion = $buildProps.Project.PropertyGroup.VersionPrefix
          $isReleaseTag = "${{ github.ref_type }}" -eq "tag" -and $refName -match '^v(?<version>\d+\.\d+\.\d+)$'

          if ($isReleaseTag) {
              $version = $Matches['version']
              $packageLabel = $refName
          } else {
              $version = $branchVersion
              $safeRef = $refName -replace '[^A-Za-z0-9._-]', '-'
              $packageLabel = "$safeRef-${{ github.run_number }}-$shortSha"
          }

          $fileVersion = "$version.0"
          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "informational_version=$version+${{ github.sha }}" >> $env:GITHUB_OUTPUT
          "package_name=TmrOverlay-$packageLabel-win-x64" >> $env:GITHUB_OUTPUT
          "is_release_tag=$($isReleaseTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore tmrOverlay.sln

      - name: Publish
        shell: pwsh
        run: |
          $publishPath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}"
          dotnet publish .\src\TmrOverlay.App\TmrOverlay.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.release_metadata.outputs.version }} `
            -p:AssemblyVersion=${{ steps.release_metadata.outputs.file_version }} `
            -p:FileVersion=${{ steps.release_metadata.outputs.file_version }} `
            -p:InformationalVersion=${{ steps.release_metadata.outputs.informational_version }} `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishPath

      - name: Audit publish output
        shell: pwsh
        run: |
          $publishPath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}"
          $manifestPath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}-manifest.txt"
          .\tools\ci\audit-windows-publish.ps1 `
            -PublishPath $publishPath `
            -ManifestPath $manifestPath `
            -PackageName "${{ steps.release_metadata.outputs.package_name }}" `
            -Version "${{ steps.release_metadata.outputs.version }}" `
            -InformationalVersion "${{ steps.release_metadata.outputs.informational_version }}"

      - name: Zip package
        shell: pwsh
        run: |
          $publishPath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}"
          $packagePath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}.zip"
          Compress-Archive -Path "$publishPath\*" -DestinationPath $packagePath -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $packagePath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}.zip"
          $checksumPath = "$packagePath.sha256"
          $hash = (Get-FileHash -Path $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $fileName = Split-Path -Path $packagePath -Leaf
          "$hash  $fileName" | Set-Content -Path $checksumPath -Encoding ascii

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version "${{ env.VELOPACK_VERSION }}"

      - name: Build Velopack release
        shell: pwsh
        run: |
          $vpk = Join-Path $env:USERPROFILE ".dotnet\tools\vpk.exe"
          $publishPath = ".\artifacts\${{ steps.release_metadata.outputs.package_name }}"
          $velopackPath = ".\artifacts\velopack"
          New-Item -ItemType Directory -Force -Path $velopackPath | Out-Null

          & $vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ github.token }}" `
            --outputDir $velopackPath `
            --channel "win-x64"
          if ($LASTEXITCODE -ne 0) {
              Write-Warning "No previous Velopack release was downloaded; continuing without a delta base."
          }
          Get-ChildItem $velopackPath -Filter "*.msi" -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $velopackPath -Filter "*Setup*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force

          & $vpk pack `
            --packId "TMROverlay" `
            --packVersion "${{ steps.release_metadata.outputs.version }}" `
            --packDir $publishPath `
            --mainExe "TMROverlay.exe" `
            --packTitle "Tech Mates Racing Overlay" `
            --packAuthors "Tech Mates Racing" `
            --outputDir $velopackPath `
            --channel "win-x64" `
            --shortcuts "Desktop,StartMenu" `
            --msi `
            --instLocation "Either" `
            --splashImage ".\assets\brand\TMRInstallerSplash.png" `
            --msiBanner ".\assets\brand\TMRMsiBanner.bmp" `
            --msiLogo ".\assets\brand\TMRMsiLogo.bmp" `
            --icon ".\src\TmrOverlay.App\Assets\TmrOverlay.ico"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $msi = Get-ChildItem $velopackPath -Filter "*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $fullPackage = Get-ChildItem $velopackPath -Filter "*${{ steps.release_metadata.outputs.version }}*-full.nupkg" | Select-Object -First 1
          $releaseIndex = Join-Path $velopackPath "releases.win-x64.json"
          if ($null -eq $msi -or $null -eq $fullPackage -or !(Test-Path $releaseIndex)) {
              Get-ChildItem $velopackPath | Format-Table Name, Length
              throw "Velopack output is missing the MSI package, full package, or releases.win-x64.json."
          }

          $uploadPath = ".\artifacts\velopack-upload"
          New-Item -ItemType Directory -Force -Path $uploadPath | Out-Null
          $uploadMsiName = "TMROverlay-v${{ steps.release_metadata.outputs.version }}-win-x64.msi"
          $uploadMsiPath = Join-Path $uploadPath $uploadMsiName
          Copy-Item $msi.FullName -Destination $uploadMsiPath -Force
          Copy-Item $releaseIndex -Destination $uploadPath -Force
          Get-ChildItem $velopackPath -Filter "*${{ steps.release_metadata.outputs.version }}*.nupkg" |
            Copy-Item -Destination $uploadPath -Force
          $uploadSetup = Get-ChildItem $uploadPath -Filter "*Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $uploadPackage = Get-ChildItem $uploadPath -Filter "*${{ steps.release_metadata.outputs.version }}*.nupkg" | Select-Object -First 1
          $uploadReleaseIndex = Join-Path $uploadPath "releases.win-x64.json"
          if (!(Test-Path $uploadMsiPath) -or $null -eq $uploadPackage -or !(Test-Path $uploadReleaseIndex) -or $null -ne $uploadSetup) {
              Get-ChildItem $uploadPath | Format-Table Name, Length
              throw "Velopack upload output must contain the named MSI, release index, and current-version packages without Setup.exe."
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release_metadata.outputs.package_name }}
          path: |
            artifacts/${{ steps.release_metadata.outputs.package_name }}.zip
            artifacts/${{ steps.release_metadata.outputs.package_name }}.zip.sha256
            artifacts/${{ steps.release_metadata.outputs.package_name }}-manifest.txt
            artifacts/velopack-upload/*

      - name: Create GitHub release
        if: steps.release_metadata.outputs.is_release_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/${{ steps.release_metadata.outputs.package_name }}.zip
            artifacts/${{ steps.release_metadata.outputs.package_name }}.zip.sha256
            artifacts/${{ steps.release_metadata.outputs.package_name }}-manifest.txt
            artifacts/velopack-upload/*

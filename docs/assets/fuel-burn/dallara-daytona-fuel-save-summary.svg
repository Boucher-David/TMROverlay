<rect x="52" y="824" width="1336" height="84" rx="8" fill="#0f172a"/>
<text class="advice-title" x="84" y="858">Teammate one-liner</text>
<text class="advice" x="84" y="888">Short-shift at slow speed, avoid low-gear limiter abuse in pit lane, and fuel-save with a full in-gear lift instead of tiny throttle.</text>
